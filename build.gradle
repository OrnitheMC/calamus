import net.ornithemc.keratin.api.TaskSelection
import net.ornithemc.keratin.api.task.mapping.UpdateIntermediaryTask

plugins {
	id 'java'
	id 'maven-publish'
	id 'keratin' version '6.6'
}

def ENV = System.getenv()

keratin {
	if (ENV.MC_VERSION) {
		minecraftVersions ENV.MC_VERSION
	}
	intermediaryGen = 2

	tasks TaskSelection.CALAMUS
}

updateIntermediary {
	fromMinecraftVersion = ENV.FROM_MC_VERSION
	fromFromMinecraftVersion = ENV.FROM_FROM_MC_VERSION
}

publishing {
	repositories {
		if (ENV.MAVEN_URL) {
			maven {
				url ENV.MAVEN_URL
				credentials {
					username ENV.MAVEN_USERNAME
					password ENV.MAVEN_PASSWORD
				}
				authentication {
					basic(BasicAuthentication)
				}
			}
		}
	}
}
